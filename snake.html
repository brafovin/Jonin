<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Snake</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
      color: #eee;
    }
    h1 { font-size: 2rem; margin-bottom: 10px; color: #4ade80; letter-spacing: 4px; }
    #score-board {
      display: flex;
      gap: 40px;
      margin-bottom: 16px;
      font-size: 1rem;
    }
    #score-board span { color: #94a3b8; }
    #score-board strong { color: #4ade80; }
    canvas {
      border: 2px solid #4ade80;
      border-radius: 4px;
      box-shadow: 0 0 20px #4ade8044;
    }
    #message {
      margin-top: 18px;
      font-size: 1rem;
      color: #94a3b8;
      height: 24px;
    }
    #message.game-over { color: #f87171; font-size: 1.2rem; }
    #restart-btn {
      margin-top: 14px;
      padding: 10px 30px;
      background: #4ade80;
      color: #1a1a2e;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      font-family: inherit;
      cursor: pointer;
      display: none;
      font-weight: bold;
      letter-spacing: 2px;
    }
    #restart-btn:hover { background: #22c55e; }
    .controls {
      margin-top: 20px;
      color: #475569;
      font-size: 0.8rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>SNAKE</h1>
  <div id="score-board">
    <div><span>PUNKTE: </span><strong id="score">0</strong></div>
    <div><span>BESTLEISTUNG: </span><strong id="high-score">0</strong></div>
  </div>
  <canvas id="canvas" width="400" height="400"></canvas>
  <div id="message">Drücke eine Pfeiltaste zum Starten</div>
  <button id="restart-btn" onclick="startGame()">NEUSTART</button>
  <div class="controls">Steuerung: Pfeiltasten oder WASD</div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const CELL = 20;
    const COLS = canvas.width / CELL;
    const ROWS = canvas.height / CELL;

    let snake, dir, nextDir, food, score, highScore, gameLoop, running, started;

    highScore = 0;

    function init() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 },
      ];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      running = false;
      started = false;
      placeFood();
      updateScore();
      draw();
      document.getElementById('message').textContent = 'Drücke eine Pfeiltaste zum Starten';
      document.getElementById('message').className = '';
      document.getElementById('restart-btn').style.display = 'none';
    }

    function placeFood() {
      let pos;
      do {
        pos = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
      } while (snake.some(s => s.x === pos.x && s.y === pos.y));
      food = pos;
    }

    function startGame() {
      if (gameLoop) clearInterval(gameLoop);
      init();
    }

    function step() {
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS ||
          snake.some(s => s.x === head.x && s.y === head.y)) {
        endGame();
        return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        if (score > highScore) highScore = score;
        updateScore();
        placeFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function endGame() {
      clearInterval(gameLoop);
      running = false;
      document.getElementById('message').textContent = `Game Over! Punkte: ${score}`;
      document.getElementById('message').className = 'game-over';
      document.getElementById('restart-btn').style.display = 'inline-block';
    }

    function updateScore() {
      document.getElementById('score').textContent = score;
      document.getElementById('high-score').textContent = highScore;
    }

    function draw() {
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 0.5;
      for (let x = 0; x <= COLS; x++) {
        ctx.beginPath(); ctx.moveTo(x * CELL, 0); ctx.lineTo(x * CELL, canvas.height); ctx.stroke();
      }
      for (let y = 0; y <= ROWS; y++) {
        ctx.beginPath(); ctx.moveTo(0, y * CELL); ctx.lineTo(canvas.width, y * CELL); ctx.stroke();
      }

      // Food
      ctx.fillStyle = '#f87171';
      ctx.shadowColor = '#f87171';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Snake
      snake.forEach((seg, i) => {
        const ratio = 1 - i / snake.length;
        ctx.fillStyle = i === 0 ? '#4ade80' : `hsl(142, 70%, ${25 + ratio * 30}%)`;
        ctx.shadowColor = i === 0 ? '#4ade80' : 'transparent';
        ctx.shadowBlur = i === 0 ? 8 : 0;
        ctx.fillRect(seg.x * CELL + 1, seg.y * CELL + 1, CELL - 2, CELL - 2);
      });
      ctx.shadowBlur = 0;

      // Eyes on head
      const h = snake[0];
      ctx.fillStyle = '#0f172a';
      const ex = dir.y === 0 ? (dir.x > 0 ? 0.65 : 0.15) : 0.3;
      const ey = dir.x === 0 ? (dir.y > 0 ? 0.65 : 0.15) : 0.3;
      ctx.beginPath();
      ctx.arc(h.x * CELL + ex * CELL, h.y * CELL + ey * CELL, 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(h.x * CELL + (1 - ex) * CELL, h.y * CELL + (dir.x === 0 ? ey : (1 - ey)) * CELL, 2, 0, Math.PI * 2);
      ctx.fill();
    }

    document.addEventListener('keydown', e => {
      const keys = {
        ArrowUp: { x: 0, y: -1 }, ArrowDown: { x: 0, y: 1 },
        ArrowLeft: { x: -1, y: 0 }, ArrowRight: { x: 1, y: 0 },
        w: { x: 0, y: -1 }, s: { x: 0, y: 1 },
        a: { x: -1, y: 0 }, d: { x: 1, y: 0 },
        W: { x: 0, y: -1 }, S: { x: 0, y: 1 },
        A: { x: -1, y: 0 }, D: { x: 1, y: 0 },
      };

      const newDir = keys[e.key];
      if (!newDir) return;

      if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();

      if (newDir.x === -dir.x && newDir.y === -dir.y) return;
      nextDir = newDir;

      if (!started) {
        started = true;
        running = true;
        document.getElementById('message').textContent = '';
        gameLoop = setInterval(step, 120);
      }
    });

    init();
  </script>
</body>
</html>
